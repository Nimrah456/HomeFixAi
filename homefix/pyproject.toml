[project]
name = "homefix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nimrah456", email = "nimrahnoor456@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "fastembed>=0.8.0",
    "groq>=0.37.1",
    "langchain>=1.3.17",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "pdfplumber>=0.11.10",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
homefix = "homefix:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
